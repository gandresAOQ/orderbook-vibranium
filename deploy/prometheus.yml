# Prometheus scrape configuration for the local stack.
#
# The app exposes OpenTelemetry metrics in Prometheus format on /metrics, so
# there is no collector in the path: Prometheus pulls directly from the service.
# That keeps the local stack to one fewer moving part while still being real
# OpenTelemetry instrumentation on the producing side.

global:
  # Short interval so a demo shows movement quickly. Production would use 15-60s.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: orderbook
    static_configs:
      - targets: ["orderbook:3000"]
    metrics_path: /metrics
